[package]
name = "ram-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Waypoint: a Windows account manager for Roblox with browser hand-off sign-in."
build = "build.rs"

[[bin]]
name = "waypoint"
path = "src/main.rs"

[dependencies]
ram-core = { path = "../ram-core" }
ram-win = { path = "../ram-win" }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-manifest = "1.4"
